<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14181e">
<title>CyberColt Booth Remote</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%2314181e'/%3E%3Ccircle cx='12' cy='13' r='4' fill='none' stroke='%23acca32' stroke-width='2'/%3E%3C/svg%3E">
<style>
  :root { --bg:#14181e; --panel:#1c2129; --line:rgba(255,255,255,0.1); --ink:#f2f4ee; --dim:#aeb4bf; --fade:#6b7280; --lime:#acca32; --gold:#e5c353; --red:#e0685f; --green:#5b8c5a; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; }
  body { background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; display:flex; flex-direction:column; align-items:center; padding:24px 18px calc(24px + env(safe-area-inset-bottom)); min-height:100%; }
  .wrap { width:100%; max-width:440px; margin:auto 0; }
  .brand { display:flex; align-items:center; gap:10px; justify-content:center; margin-bottom:22px; }
  .brand .mark { width:34px; height:34px; border-radius:9px; background:#0f1216; display:flex; align-items:center; justify-content:center; }
  .brand .mark svg { width:22px; height:22px; }
  .brand .name { font-weight:900; font-size:1.05rem; letter-spacing:-0.02em; }
  .brand .name small { display:block; font-weight:700; font-size:0.6rem; letter-spacing:0.24em; text-transform:uppercase; color:var(--gold); }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:20px; margin-bottom:16px; }
  .status-top { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; }
  .dot { width:11px; height:11px; border-radius:50%; background:var(--fade); flex:0 0 auto; box-shadow:0 0 0 0 rgba(0,0,0,0); }
  .dot.online { background:var(--green); box-shadow:0 0 10px rgba(91,140,90,0.7); }
  .dot.offline { background:var(--red); }
  .online-txt { font-family:ui-monospace,monospace; font-size:0.66rem; letter-spacing:0.14em; text-transform:uppercase; color:var(--dim); }
  .evname { font-weight:800; font-size:1.25rem; line-height:1.2; }
  .evsub { color:var(--fade); font-size:0.78rem; margin-top:2px; }
  .activity { margin-top:16px; display:flex; align-items:center; gap:12px; }
  .badge { font-family:ui-monospace,monospace; font-weight:700; font-size:0.72rem; letter-spacing:0.14em; text-transform:uppercase; padding:8px 14px; border-radius:999px; border:1px solid var(--line); color:var(--dim); }
  .badge.idle { color:var(--lime); border-color:rgba(172,202,50,0.4); }
  .badge.capturing, .badge.composing, .badge.preview { color:var(--gold); border-color:rgba(229,195,83,0.4); }
  .badge.unpaired, .badge.offline { color:var(--red); border-color:rgba(224,104,95,0.4); }
  .metrics { display:flex; gap:10px; margin-top:16px; }
  .metric { flex:1; background:#0f1216; border-radius:12px; padding:12px; text-align:center; }
  .metric .v { font-weight:800; font-size:1.15rem; }
  .metric .l { color:var(--fade); font-size:0.62rem; letter-spacing:0.12em; text-transform:uppercase; margin-top:3px; }
  .btns { display:flex; flex-direction:column; gap:12px; }
  button.act { appearance:none; border:none; border-radius:16px; padding:20px; font-size:1.1rem; font-weight:800; cursor:pointer; transition:transform 0.08s, opacity 0.15s; display:flex; align-items:center; justify-content:center; gap:10px; }
  button.act:active { transform:scale(0.98); }
  button.act:disabled { opacity:0.4; cursor:not-allowed; }
  button.start { background:var(--lime); color:#14181e; }
  button.cancel { background:transparent; color:var(--red); border:2px solid rgba(224,104,95,0.5); }
  button.act svg { width:22px; height:22px; }
  .toast { position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom)); transform:translateX(-50%) translateY(20px); background:#000; color:#fff; padding:12px 20px; border-radius:999px; font-size:0.85rem; font-weight:600; opacity:0; pointer-events:none; transition:opacity 0.2s, transform 0.2s; z-index:50; max-width:90vw; text-align:center; }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  .msg { text-align:center; color:var(--dim); line-height:1.6; padding:30px 10px; }
  .msg strong { color:var(--ink); }
  .foot { text-align:center; color:var(--fade); font-size:0.68rem; margin-top:8px; }
  .hidden { display:none !important; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="#acca32" stroke-width="2"><rect x="3" y="6" width="18" height="14" rx="2"/><circle cx="12" cy="13" r="3.5"/></svg></span>
      <span class="name">cybercolt<small>booth remote</small></span>
    </div>

    <div id="app" class="hidden">
      <div class="card">
        <div class="status-top">
          <div><div class="evname" id="evName">Booth</div><div class="evsub" id="evSub"></div></div>
          <div style="display:flex;align-items:center;gap:8px;"><span class="online-txt" id="onlineTxt">…</span><span class="dot" id="dot"></span></div>
        </div>
        <div class="activity"><span class="badge" id="badge">—</span></div>
        <div class="metrics">
          <div class="metric"><div class="v" id="printsV">—</div><div class="l">Prints left</div></div>
          <div class="metric"><div class="v" id="verV">—</div><div class="l">Booth ver</div></div>
        </div>
      </div>

      <div class="btns">
        <button class="act start" id="startBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 3l14 9-14 9z"/></svg> Start photo session</button>
        <button class="act cancel" id="cancelBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M18 6L6 18M6 6l12 12"/></svg> Cancel current session</button>
      </div>
      <div class="foot" id="foot"></div>
    </div>

    <div id="gate" class="msg hidden"></div>
    <div id="loading" class="msg">Connecting to the booth…</div>
  </div>
  <div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, doc, onSnapshot, setDoc } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const firebaseConfig = {
  apiKey:            'AIzaSyDcGx0V3fbWtcajFMQ3cYZ5mQuRnEmpHwI',
  authDomain:        'cybercolt-photobooth.firebaseapp.com',
  projectId:         'cybercolt-photobooth',
  storageBucket:     'cybercolt-photobooth.firebasestorage.app',
  messagingSenderId: '693027530065',
  appId:             '1:693027530065:web:52c7caf94823165aa75f70',
};

const params = new URLSearchParams(location.search);
const CODE  = (params.get('e') || '').trim();
const BOOTH = (params.get('b') || '').trim();
const TOKEN = (params.get('t') || '').trim();

const $ = (id) => document.getElementById(id);
const showGate = (html) => { $('loading').classList.add('hidden'); $('app').classList.add('hidden'); const g = $('gate'); g.innerHTML = html; g.classList.remove('hidden'); };
let toastT = null;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600); }

if (!CODE || !BOOTH || !TOKEN) {
  showGate('Open this page by <strong>scanning the QR code on the booth</strong> (Booth console → Remote). A remote link needs the booth’s pairing code.');
} else {
  start();
}

function start() {
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const statusRef = doc(db, 'events', CODE, 'remote', BOOTH);
  const cmdRef    = doc(db, 'events', CODE, 'remote', `${BOOTH}_cmd`);

  let last = null;
  let lastAckSeen = null;

  const ONLINE_MS = 45000;   // booth heartbeats every ~20s
  function isOnline(d) { return d && d.lastSeen && (Date.now() - d.lastSeen) < ONLINE_MS; }

  function render(d) {
    $('loading').classList.add('hidden');
    $('gate').classList.add('hidden');
    $('app').classList.remove('hidden');

    // Wrong/expired token → this link was revoked with "New code".
    if (d && d.token && d.token !== TOKEN) {
      showGate('This remote link is <strong>no longer valid</strong>. On the booth, open <strong>Remote</strong> again and scan the new code.');
      return;
    }

    const online = isOnline(d);
    $('dot').className = 'dot ' + (online ? 'online' : 'offline');
    $('onlineTxt').textContent = online ? 'Online' : 'Offline';
    $('evName').textContent = (d && d.eventName) || 'Booth';
    $('evSub').textContent = 'Booth ' + BOOTH.replace(/^dev_/, '').slice(0, 6).toUpperCase();

    const act = online ? ((d && d.activity) || 'idle') : 'offline';
    const labels = { idle:'Idle · ready', capturing:'Taking photos', composing:'Building strip', preview:'On preview', unpaired:'Not paired', offline:'Offline' };
    const badge = $('badge');
    badge.className = 'badge ' + act;
    badge.textContent = labels[act] || act;

    const prints = (d && (d.printsLeft === null || d.printsLeft === undefined)) ? (d && d.printEnabled === false ? '—' : '∞') : String(d.printsLeft);
    $('printsV').textContent = online ? prints : '—';
    $('verV').textContent = (d && d.appVersion) ? ('v' + d.appVersion) : '—';

    $('startBtn').disabled  = !online || act !== 'idle';
    $('cancelBtn').disabled = !online || (act !== 'capturing' && act !== 'composing');

    // Surface the booth's ack of our last command once.
    if (d && d.lastCmdId && d.lastCmdId !== lastAckSeen && d.lastCmdResult) {
      lastAckSeen = d.lastCmdId;
      const r = d.lastCmdResult;
      if (r === 'ok') { /* the activity change is feedback enough */ }
      else if (r === 'busy') toast('Booth is busy — can’t start right now');
      else if (r === 'nothing-to-reprint') toast('Nothing to reprint yet');
      else if (r !== 'ok') toast('Booth: ' + r);
    }
    last = d;
  }

  onSnapshot(statusRef, (snap) => {
    render(snap.exists() ? snap.data() : null);
  }, (err) => { showGate('Could not reach the booth. Check your connection and try again.<br><br><small>' + (err.message || err) + '</small>'); });

  // Re-evaluate "online" on a timer even without new snapshots (freshness decays).
  setInterval(() => { if (last !== null) render(last); }, 5000);

  async function sendCmd(action) {
    const id = `${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;
    try {
      await setDoc(cmdRef, { action, token: TOKEN, id, createdAt: Date.now() });
    } catch (e) { toast('Send failed: ' + (e.message || e)); }
  }

  $('startBtn').addEventListener('click', () => { if ($('startBtn').disabled) return; sendCmd('start'); toast('Starting…'); });
  $('cancelBtn').addEventListener('click', () => { if ($('cancelBtn').disabled) return; sendCmd('cancel'); toast('Cancelling…'); });
}
</script>
</body>
</html>
